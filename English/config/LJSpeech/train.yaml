path:
  ckpt_path: ./output/ckpt/LJSpeech
  log_path: ./output/log/LJSpeech
  result_path: ./output/result/LJSpeech
optimizer:
  batch_size: 8
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-09
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 2
  warm_up_step: 4000
  anneal_steps:
  - 300000
  - 400000
  - 500000
  anneal_rate: 0.3
step:
  total_step: 20000
  log_step: 100
  synth_step: 5000
  val_step: 1000
  save_step: 5000
total_step: 20000
save_step: 5000
val_step: 2000
synth_step: 5000
